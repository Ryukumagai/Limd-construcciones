<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIMD Construcciones</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f5f5f5;
}

header{
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
    background:#111;
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#fff;
    font-size:32px;
    font-weight:bold;
}

.logo span{
    color:#ff8c00;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:bold;
}

.hero{
    height:100vh;
    background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url("https://images.unsplash.com/photo-1504307651254-35680f356dfd");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    color:white;
}

.hero-content{
    width:90%;
    max-width:1200px;
    margin:auto;
}

.hero h1{
    font-size:70px;
    line-height:1.1;
}

.hero h1 span{
    color:#ff8c00;
}

.hero p{
    margin-top:20px;
    font-size:22px;
    max-width:700px;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:15px 35px;
    background:#ff8c00;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

section{
    padding:80px 10%;
}

.titulo{
    text-align:center;
    font-size:40px;
    margin-bottom:50px;
    color:#222;
}

.servicios{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
    text-align:center;
}

.card h3{
    color:#ff8c00;
    margin-bottom:15px;
}

.nosotros{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
    align-items:center;
}

.nosotros img{
    width:100%;
    border-radius:15px;
}

.nosotros p{
    font-size:18px;
    line-height:1.8;
}

.galeria{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.galeria img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:10px;
}

.contacto{
    background:#111;
    color:white;
    text-align:center;
}

.contacto p{
    margin:15px 0;
    font-size:20px;
}

footer{
    background:black;
    color:white;
    text-align:center;
    padding:20px;
}

.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    width:65px;
    height:65px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    text-decoration:none;
}

@media(max-width:768px){

.hero h1{
    font-size:45px;
}

.nosotros{
    grid-template-columns:1fr;
}

nav{
    display:none;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
L<span>I</span>MD
</div>

<nav>
<a href="#inicio">Inicio</a>
<a href="#nosotros">Nosotros</a>
<a href="#servicios">Servicios</a>
<a href="#pro
